name: Lint with JSHint

on:
  push:
    branches:
      - f24
  pull_request:
    branches:
      - f24

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14' 

      - name: Install dependencies
        run: npm install

      - name: Run JSHint on src directory
        run: npx jshint src
